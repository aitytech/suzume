name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches the canonical version and all mirrors
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          CMAKE_VERSION=$(grep -Eo 'project\(suzume VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)"
            exit 1
          fi
          scripts/check_version_mirror.sh

  publish-npm:
    needs: verify-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16

      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11
      - run: corepack enable
      - run: corepack prepare yarn@4.12.0 --activate

      - name: Build native and compile dictionaries
        working-directory: ${{ github.workspace }}
        run: |
          cmake -B build -DBUILD_WASM=OFF
          cmake --build build --parallel
          cmake --build build --target build-dict

      - name: Run C++ tests
        working-directory: ${{ github.workspace }}
        run: ctest --test-dir build --output-on-failure

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn test
      - run: npm publish --access public --provenance

  build-wheels:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-14   # arm64
          - os: macos-13   # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install wheel
      - name: Build platform wheel
        working-directory: bindings/python
        run: ./build_wheel.sh
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  publish-pypi:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/suzume
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Tolerate re-runs of the tag workflow after a partial failure:
          # wheels already on PyPI are skipped instead of failing the job.
          skip-existing: true

  github-release:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
