name: CI

on:
  push:
    branches: [main, develop]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# On develop, a new push supersedes any still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: bindings/wasm/yarn.lock
      - run: yarn install --immutable
      - run: yarn lint

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ratchet on hardcoded word tests / raw score literals / file length,
      # plus WASM-core purity (no unguarded file-I/O headers). See CLAUDE.md.
      - run: scripts/check_code_guardrails.sh
      # Version must stay in lockstep across every binding manifest.
      - run: scripts/check_version_mirror.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: bindings/wasm/yarn.lock
      - name: Build native and compile dictionaries
        run: |
          cmake -B build -DBUILD_WASM=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage"
          cmake --build build --parallel
          cmake --build build --target build-dict
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build WASM binding
        working-directory: bindings/wasm
        run: |
          yarn install --immutable
          yarn build
      - name: Check WASM size regression
        run: scripts/check_wasm_size.sh bindings/wasm/dist/suzume.wasm
      - name: Run WASM tests
        working-directory: bindings/wasm
        run: yarn test

  python-binding:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build shared C-ABI library
        run: |
          cmake -B build-shared -DBUILD_SHARED=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_DEBUG_INFO=OFF -DENABLE_DEBUG_LOG=OFF
          cmake --build build-shared --target suzume_shared --parallel
      - name: Install Python binding
        working-directory: bindings/python
        run: pip install -e ".[dev]"
      - name: Lint and type-check
        working-directory: bindings/python
        run: |
          ruff check .
          ruff format --check .
          mypy src/suzume
      - name: Run Python tests
        working-directory: bindings/python
        run: pytest -q
